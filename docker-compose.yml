services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dialogueforge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - VITE_API_URL=/api
    restart: unless-stopped
    networks:
      - dialogueforge

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://dialogueforge:changeme_in_production@postgres:5432/dialogueforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      - MAX_CONCURRENT_GENERATIONS=${MAX_CONCURRENT_GENERATIONS:-5}
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CHATTERBOX_URL=http://chatterbox:5000
      - XTTS_URL=http://xtts:5000
      - ORPHEUS_URL=http://orpheus:5000
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - dialogueforge

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_worker:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://dialogueforge:changeme_in_production@postgres:5432/dialogueforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      - MAX_CONCURRENT_GENERATIONS=${MAX_CONCURRENT_GENERATIONS:-5}
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - CHATTERBOX_URL=http://chatterbox:5000
      - XTTS_URL=http://xtts:5000
      - ORPHEUS_URL=http://orpheus:5000
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dialogueforge

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - dialogueforge

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dialogueforge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-dialogueforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialogueforge"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - dialogueforge

  # ── GPU TTS sidecars (optional — comment out any you don't need) ──

  chatterbox:
    build: ./services/chatterbox
    expose:
      - "5000"
    volumes:
      - model_cache:/root/.cache
      - outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - dialogueforge
    profiles:
      - gpu

  xtts:
    build: ./services/xtts
    expose:
      - "5000"
    volumes:
      - model_cache:/root/.cache
      - outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - dialogueforge
    profiles:
      - gpu

  orpheus:
    build: ./services/orpheus
    expose:
      - "5000"
    volumes:
      - model_cache:/root/.cache
      - outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - dialogueforge
    profiles:
      - gpu

volumes:
  uploads:
  outputs:
  redis_data:
  postgres_data:
  model_cache:

networks:
  dialogueforge:
    driver: bridge
